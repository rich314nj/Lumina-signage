<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumina Player</title>
<!-- Vendored by the installer so PDFs render with no internet (#15). If the
     download was unavailable at install time, loadPdf() falls back to the CDN. -->
<script src="/static/vendor/pdfjs/pdf.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; background: #000;
  overflow: hidden; font-family: sans-serif;
}
#player { width: 100%; height: 100%; position: relative; }
#mediaContainer {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
#videoEl {
  width: 100%; height: 100%;
  object-fit: contain; display: none;
}
#imageEl {
  width: 100%; height: 100%;
  object-fit: contain; display: none;
}
#iframeEl {
  width: 100%; height: 100%;
  border: none; display: none;
}
#pdfCanvas {
  max-width: 100%; max-height: 100%;
  object-fit: contain; display: none;
  background: white;
}
#pdfPageBadge {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.7);
  padding: 4px 12px; border-radius: 99px; font-size: 11px;
  font-family: monospace; opacity: 0; transition: opacity 0.3s;
  z-index: 100; pointer-events: none;
}
#player:hover #pdfPageBadge { opacity: 1; }
/* Setup screen. Sized to be readable across a room, since this is what a
   new device shows on the TV before it has content. */
#emptyState {
  color: #e8ecf0; text-align: center;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 4vh 4vw; max-width: 1100px;
}
#emptyState h2 { font-size: clamp(28px, 4.5vw, 56px); margin-bottom: 12px; font-weight: 700; }
#emptyState p { font-size: clamp(15px, 1.8vw, 24px); color: #8899aa; }
.setup-card {
  margin-top: clamp(20px, 4vh, 48px);
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  padding: clamp(20px, 3.5vh, 40px) clamp(24px, 4vw, 56px);
}
.setup-step {
  display: flex; align-items: center; gap: clamp(12px, 1.6vw, 22px);
  text-align: left; margin-bottom: clamp(14px, 2vh, 22px);
}
.setup-step:last-child { margin-bottom: 0; }
.setup-num {
  flex-shrink: 0;
  width: clamp(30px, 3.2vw, 44px); height: clamp(30px, 3.2vw, 44px);
  border-radius: 50%; background: #e8721c; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(15px, 1.7vw, 22px); font-weight: 700;
}
.setup-text { font-size: clamp(15px, 1.9vw, 26px); color: #c8d0d8; line-height: 1.35; }
.setup-value {
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  color: #f59542; font-weight: 700;
  background: rgba(232,114,28,0.12);
  padding: 0.08em 0.4em; border-radius: 6px;
  white-space: nowrap;
}
.setup-foot {
  margin-top: clamp(16px, 2.5vh, 28px);
  font-size: clamp(12px, 1.3vw, 17px); color: #55626f;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
}

/* HUD */
#hud {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  opacity: 0; transition: opacity 0.3s;
  z-index: 100;
}
#player:hover #hud { opacity: 1; }
#currentName { color: white; font-size: 14px; font-weight: 600; }
#currentMeta { color: rgba(255,255,255,0.5); font-size: 11px; font-family: monospace; }
#progressBar {
  position: fixed; bottom: 0; left: 0; height: 3px;
  background: #e8721c; transition: width 0.5s linear;
  z-index: 200;
}
#controls { display: flex; gap: 8px; }
.ctrl-btn {
  background: rgba(255,255,255,0.15); border: none; color: white;
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  font-size: 16px; transition: background 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.3); }
#itemCounter {
  position: fixed; top: 16px; right: 16px;
  background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.6);
  padding: 4px 10px; border-radius: 99px; font-size: 11px;
  font-family: monospace; opacity: 0; transition: opacity 0.3s;
  z-index: 100;
}
#player:hover #itemCounter { opacity: 1; }
#logo-watermark {
  position: fixed; top: 16px; left: 16px;
  font-size: 13px; font-family: monospace;
  color: rgba(255,255,255,0.2); letter-spacing: 2px;
  z-index: 100;
}

/* Transition overlay */
#fadeOverlay {
  position: fixed; inset: 0; background: black;
  pointer-events: none; opacity: 0; transition: opacity 0.5s;
  z-index: 50;
}
#fadeOverlay.fade-in { opacity: 1; }
</style>
</head>
<body>
<div id="player">
  <div id="fadeOverlay"></div>
  <div id="mediaContainer">
    <video id="videoEl" autoplay muted></video>
    <img id="imageEl" alt="">
    <iframe id="iframeEl" allowfullscreen allow="autoplay; fullscreen"></iframe>
    <canvas id="pdfCanvas"></canvas>
    <div id="pdfPageBadge">Page 1 / 1</div>
    <div id="emptyState">
      <div style="font-size:clamp(40px,6vw,80px);margin-bottom:8px;color:#e8721c;opacity:0.85">◈</div>
      <h2 id="setupTitle">Ready to set up</h2>
      <p id="setupSubtitle">This screen has no content yet.</p>
      <div class="setup-card" id="setupCard"></div>
      <div class="setup-foot" id="setupFoot"></div>
    </div>
  </div>
  <div id="progressBar"></div>
  <div id="logo-watermark">LuminaShow</div>
  <div id="itemCounter">1 / 1</div>
  <div id="hud">
    <div>
      <div id="currentName">—</div>
      <div id="currentMeta">—</div>
    </div>
    <div id="controls">
      <button class="ctrl-btn" onclick="prevItem()" title="Previous">◄</button>
      <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()" title="Pause">⏸</button>
      <button class="ctrl-btn" onclick="nextItem()" title="Next">►</button>
      <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
    </div>
  </div>
</div>

<script>
// State
let playlist = null;
let items = [];
let currentIdx = 0;
let timer = null;
let paused = false;
let progressInterval = null;
let progressStart = null;   // timestamp of last resume
let remainingMs = 0;        // ms left when last paused

// FIX #2: track whether the duration-based timer has already fired,
// so videoEl.onended doesn't trigger a second advance.
let advanceLocked = false;

// PDF state
let pdfDoc = null;
let pdfCurrentPage = 0;
let pdfTotalPages = 0;
let pdfPageTimer = null;
let pdfMsPerPage = 0;
let pdfPageStart = null;       // timestamp when current page timer started
let pdfPageRemainingMs = null; // ms left on page tick when paused

// Elements
const videoEl = document.getElementById('videoEl');
const imageEl = document.getElementById('imageEl');
const iframeEl = document.getElementById('iframeEl');
const pdfCanvas = document.getElementById('pdfCanvas');
const pdfPageBadge = document.getElementById('pdfPageBadge');
const emptyEl = document.getElementById('emptyState');
const nameEl = document.getElementById('currentName');
const metaEl = document.getElementById('currentMeta');
const counterEl = document.getElementById('itemCounter');
const progressBar = document.getElementById('progressBar');
const pauseBtn = document.getElementById('pauseBtn');
const fadeOverlay = document.getElementById('fadeOverlay');

function extractYouTubeId(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    const path = u.pathname || '';

    // youtu.be/<id>
    if (host === 'youtu.be') {
      const id = path.split('/').filter(Boolean)[0] || '';
      return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
    }

    // youtube.com/watch?...&v=<id>
    if (host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') {
      const v = u.searchParams.get('v');
      if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v;

      // youtube.com/embed/<id>, /shorts/<id>, /live/<id>, /v/<id>
      const parts = path.split('/').filter(Boolean);
      if (parts.length >= 2 && ['embed', 'shorts', 'live', 'v'].includes(parts[0])) {
        const id = parts[1];
        return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
      }
    }
  } catch (_) {
    // Fall through to regex-based parsing below.
  }

  // Non-URL / malformed fallback parsing.
  const m = String(url).match(
    /(?:youtube\.com\/(?:watch\?.*?[?&]v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
  );
  return m ? m[1] : null;
}

// ── YouTube embed error detection (issue #6) ─────────────────────────────────
// A bare <iframe> embed gives no signal when YouTube refuses playback
// (embedding disabled, deleted video, ended live stream → api.invalidparam):
// the error screen just sits there for the item's full duration. With
// enablejsapi=1 the embed speaks the widget postMessage protocol — after a
// "listening" handshake it emits events, including onError, so broken videos
// can be skipped.
let ytWatchActive = false;
let ytHandshakeTimer = null;

const YT_ERROR_LABELS = {
  2: 'invalid video id',
  5: 'player error',
  100: 'video not found',
  101: 'embedding disabled',
  150: 'embedding disabled'
};

function startYouTubeErrorWatch() {
  ytWatchActive = true;
  // The embed only emits events after receiving a "listening" handshake, and
  // the iframe loads asynchronously — ping until the first message comes back
  // (or the item is torn down).
  let attempts = 0;
  ytHandshakeTimer = setInterval(() => {
    if (!ytWatchActive || ++attempts > 20) { stopYouTubeErrorWatch(ytWatchActive); return; }
    try {
      iframeEl.contentWindow.postMessage(
        JSON.stringify({ event: 'listening', id: 'lumina', channel: 'widget' }),
        'https://www.youtube.com'
      );
    } catch (_) {}
  }, 500);
}

function stopYouTubeErrorWatch(keepActive) {
  if (ytHandshakeTimer) { clearInterval(ytHandshakeTimer); ytHandshakeTimer = null; }
  if (!keepActive) ytWatchActive = false;
}

window.addEventListener('message', (e) => {
  if (!ytWatchActive || e.origin !== 'https://www.youtube.com') return;
  let data;
  try { data = JSON.parse(e.data); } catch (_) { return; }
  if (!data || typeof data !== 'object') return;
  // Any message back means the handshake landed — stop pinging.
  if (ytHandshakeTimer) { clearInterval(ytHandshakeTimer); ytHandshakeTimer = null; }
  if (data.event === 'onError') {
    ytWatchActive = false;
    const label = YT_ERROR_LABELS[data.info] || `error ${data.info}`;
    metaEl.textContent = `YouTube · ${label} — skipping`;
    // Replace the full-duration timer with a short one so the message is
    // briefly visible, then move on.
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => safeAdvance(), 1500);
  }
});

function extractVimeoId(url) {
  if (!url) return null;
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./, '').toLowerCase();
    const pathParts = (u.pathname || '').split('/').filter(Boolean);
    if (host.endsWith('vimeo.com')) {
      // Supports:
      // vimeo.com/<id>
      // player.vimeo.com/video/<id>
      // vimeo.com/channels/<name>/<id>, /groups/<name>/videos/<id>, etc.
      for (const part of pathParts) {
        if (/^\d+$/.test(part)) return part;
      }
    }
  } catch (_) {
    // Fall through to regex-based parsing below.
  }

  const m = String(url).match(/vimeo\.com\/(?:.*\/)?(\d+)/i);
  return m ? m[1] : null;
}

// Identity of the content currently on screen. The poll below runs often, so
// playback must only restart when this actually changes — see FIX #13.
let playlistSignature = null;

function signatureOf(pl) {
  if (!pl || !pl.items) return null;
  return JSON.stringify([
    pl.id,
    pl.loop,
    pl.items.map(i => [
      i.asset && i.asset.id,
      i.asset && i.asset.uri,
      i.asset && i.asset.duration,
      i.duration_override
    ])
  ]);
}

async function loadPlaylist() {
  const urlParams = new URLSearchParams(window.location.search);
  const playlistId = urlParams.get('playlist');
  const url = playlistId ? `/api/playlists/${playlistId}` : '/api/current-playlist';

  let incoming;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    incoming = await res.json();
  } catch (e) {
    // FIX #14: a transient failure (service restart, nginx reload, network
    // blip) must not blank a working screen. Keep playing and try again on
    // the next poll; only fall back to the setup screen if there is nothing
    // on screen to keep.
    if (!items.length) showEmpty();
    return;
  }

  const hasContent = incoming && incoming.items && incoming.items.length > 0;
  if (!hasContent) {
    playlistSignature = null;
    playlist = null;
    items = [];
    showEmpty();
    return;
  }

  const signature = signatureOf(incoming);

  // FIX #13: previously this reset currentIdx to 0 and restarted playback on
  // every poll, so any playlist longer than the poll interval never reached
  // its later items. Restart only when the content genuinely changed.
  if (signature === playlistSignature && items.length) {
    playlist = incoming;
    items = incoming.items.filter(i => i.asset);
    return;
  }

  playlistSignature = signature;
  playlist = incoming;
  items = incoming.items.filter(i => i.asset);
  currentIdx = 0;
  showItem(currentIdx);
}

// ── Setup screen ───────────────────────────────────────────────────────────────
// With no content, the screen itself tells the operator what to do next —
// either how to join the device to WiFi (via the fallback hotspot) or which
// address to open to add content.
let setupPoll = null;

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function step(n, html) {
  return `<div class="setup-step"><div class="setup-num">${n}</div><div class="setup-text">${html}</div></div>`;
}

async function renderSetupScreen() {
  const title = document.getElementById('setupTitle');
  const subtitle = document.getElementById('setupSubtitle');
  const card = document.getElementById('setupCard');
  const foot = document.getElementById('setupFoot');
  let info = null;
  try {
    info = await (await fetch('/api/device-info')).json();
  } catch (e) { /* server not reachable yet — fall through to generic help */ }

  if (info && info.setup_ap) {
    const ap = info.setup_ap;
    title.textContent = 'Connect this screen to WiFi';
    subtitle.textContent = 'This device is not on a network yet. Use a phone or laptop to set it up.';
    card.innerHTML =
      step(1, `Join the WiFi network <span class="setup-value">${escHtml(ap.ssid)}</span>` +
              (ap.password ? ` using password <span class="setup-value">${escHtml(ap.password)}</span>` : '')) +
      step(2, `Open <span class="setup-value">${escHtml(ap.url)}</span> in a web browser`) +
      step(3, `Sign in, open <b>Network</b>, and choose your WiFi network`);
    foot.textContent = 'The screen updates automatically once the device joins your network.';
    return;
  }

  const addresses = (info && info.addresses) || [];
  if (addresses.length) {
    title.textContent = 'Ready for content';
    subtitle.textContent = 'This screen is connected and waiting for a playlist.';
    card.innerHTML =
      step(1, `On any device on the same network, open ` +
              addresses.map(a => `<span class="setup-value">http://${escHtml(a)}</span>`).join(' or ')) +
      step(2, `Sign in and upload images, video, or PDFs under <b>Assets</b>`) +
      step(3, `Create a playlist, mark it <b>Active</b>, and it starts playing here`);
    foot.textContent = info.hostname
      ? `Device: ${info.hostname}  ·  also reachable at http://${info.hostname}.local`
      : '';
  } else if (info && info.wired_link) {
    // Cabled but no address yet — never advertise WiFi setup here.
    title.textContent = 'Waiting for the network';
    subtitle.textContent = 'A network cable is connected but this screen has not received an address yet.';
    card.innerHTML = step('!', 'This usually clears on its own within a minute. If it persists, check that the cable’s network provides DHCP.');
    foot.textContent = info.hostname ? `Device: ${info.hostname}` : '';
  } else {
    title.textContent = 'Starting up';
    subtitle.textContent = 'Waiting for the LuminaShow service and network to come up…';
    card.innerHTML = step('!', 'If this message stays for more than a few minutes, connect an Ethernet cable or check power.');
    foot.textContent = '';
  }
}

// Tells the server the display is alive and what it is showing (#10). A
// healthy service does not mean a working screen, and this is what makes the
// difference visible. Never allowed to interfere with playback.
function sendHeartbeat(item, playlistName) {
  try {
    fetch('/api/player/heartbeat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ item: item || null, playlist: playlistName || null })
    }).catch(() => {});
  } catch (e) { /* ignore */ }
}

function showEmpty() {
  hideAll();
  emptyEl.style.display = 'block';
  sendHeartbeat(null, null);
  renderSetupScreen();
  // Poll faster than the normal schedule check so the screen picks up its
  // first playlist (or a new IP) promptly during setup.
  if (!setupPoll) {
    setupPoll = setInterval(async () => {
      if (emptyEl.style.display === 'none') {
        clearInterval(setupPoll); setupPoll = null; return;
      }
      // The main poll below already calls loadPlaylist(); this only needs to
      // refresh what the setup screen displays (address, hotspot state).
      renderSetupScreen();
    }, 15000);
  }
}

function hideAll() {
  videoEl.style.display = 'none';
  imageEl.style.display = 'none';
  iframeEl.style.display = 'none';
  pdfCanvas.style.display = 'none';
  pdfPageBadge.style.display = 'none';
  emptyEl.style.display = 'none';
  videoEl.onended = null;
  videoEl.src = '';
  iframeEl.src = '';
  stopYouTubeErrorWatch(false);
  if (pdfPageTimer) { clearTimeout(pdfPageTimer); pdfPageTimer = null; }
  pdfDoc = null;
}

function safeAdvance() {
  // FIX #2: guard so only the first caller (timer or onended) wins
  if (advanceLocked) return;
  advanceLocked = true;
  advance();
}

function showItem(idx) {
  if (!items.length) { showEmpty(); return; }
  const item = items[idx];
  const asset = item.asset;
  const duration = (item.duration_override || asset.duration) * 1000;
  advanceLocked = false;

  // Always resume when switching items, regardless of prior pause state
  paused = false;
  pauseBtn.textContent = '⏸';

  clearTimers();
  fadeOut(async () => {
    hideAll();
    nameEl.textContent = asset.name;
    counterEl.textContent = `${idx + 1} / ${items.length}`;
    sendHeartbeat(asset.name, playlist && playlist.name);

    switch (asset.asset_type) {
      case 'image':
        imageEl.src = asset.uri;
        imageEl.style.display = 'block';
        metaEl.textContent = `Image · ${duration / 1000}s`;
        startProgress(duration);
        timer = setTimeout(() => safeAdvance(), duration);
        break;

      case 'video':
        videoEl.src = asset.uri;
        videoEl.style.display = 'block';
        videoEl.muted = false;
        metaEl.textContent = `Video · ${duration / 1000}s`;
        videoEl.play().catch(() => { videoEl.muted = true; videoEl.play(); });
        // FIX #2: onended uses safeAdvance — the duration timer below also
        // uses safeAdvance. Only the first one to fire will actually advance.
        videoEl.onended = () => safeAdvance();
        startProgress(duration);
        timer = setTimeout(() => safeAdvance(), duration);
        break;

      case 'youtube': {
        const vid = extractYouTubeId(asset.uri);
        if (!vid) {
          metaEl.textContent = 'YouTube · Invalid URL';
          // Avoid loading a broken YouTube iframe with empty/invalid video id.
          timer = setTimeout(() => safeAdvance(), 1000);
          break;
        }
        const embedOrigin = encodeURIComponent(window.location.origin);
        iframeEl.src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=0&controls=1&rel=0&playsinline=1&enablejsapi=1&origin=${embedOrigin}`;
        iframeEl.style.display = 'block';
        metaEl.textContent = `YouTube · ${duration / 1000}s`;
        startYouTubeErrorWatch();
        startProgress(duration);
        timer = setTimeout(() => safeAdvance(), duration);
        break;
      }

      case 'pdf':
        pdfCanvas.style.display = 'block';
        pdfPageBadge.style.display = 'block';
        metaEl.textContent = `PDF · ${duration / 1000}s`;
        startProgress(duration);
        timer = setTimeout(() => safeAdvance(), duration);
        loadPdf(asset.uri, duration);
        break;

      case 'vimeo': {
        const vid = extractVimeoId(asset.uri);
        if (!vid) {
          metaEl.textContent = 'Vimeo · Invalid URL';
          timer = setTimeout(() => safeAdvance(), 1000);
          break;
        }
        iframeEl.src = `https://player.vimeo.com/video/${vid}?autoplay=1&title=0&byline=0`;
        iframeEl.style.display = 'block';
        metaEl.textContent = `Vimeo · ${duration / 1000}s`;
        startProgress(duration);
        timer = setTimeout(() => safeAdvance(), duration);
        break;
      }

      default:
        iframeEl.src = asset.uri;
        iframeEl.style.display = 'block';
        metaEl.textContent = `Web · ${duration / 1000}s`;
        startProgress(duration);
        timer = setTimeout(() => safeAdvance(), duration);
    }

    fadeIn();
  });
}

function advance() {
  if (!items.length) return;
  currentIdx = (currentIdx + 1) % items.length;
  if (currentIdx === 0 && playlist && !playlist.loop) {
    showEmpty(); return;
  }
  showItem(currentIdx);
}

// ── PDF page-by-page renderer ──────────────────────────────────────────────────
const PDFJS_LOCAL = '/static/vendor/pdfjs/';
const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLibLoading = null;

// Returns the base URL the library was loaded from, so the worker is fetched
// from the same place. Prefers the local copy; only reaches for the network
// when the installer could not vendor it.
function ensurePdfLib() {
  if (window.pdfjsLib) return Promise.resolve(PDFJS_LOCAL);
  if (!pdfLibLoading) {
    pdfLibLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = PDFJS_CDN + 'pdf.min.js';
      s.onload = () => resolve(PDFJS_CDN);
      s.onerror = () => reject(new Error('PDF.js unavailable locally and offline'));
      document.head.appendChild(s);
    });
  }
  return pdfLibLoading;
}

async function loadPdf(uri, totalDurationMs) {
  try {
    const base = await ensurePdfLib();
    pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
  } catch (e) {
    console.error('PDF renderer unavailable:', e);
    metaEl.textContent = 'PDF · renderer unavailable — skipping';
    safeAdvance();
    return;
  }
  try {
    pdfDoc = await pdfjsLib.getDocument(uri).promise;
    pdfTotalPages = pdfDoc.numPages;
    pdfCurrentPage = 1;
    // Divide total asset duration evenly across all pages (min 2s per page)
    pdfMsPerPage = Math.max(2000, Math.floor(totalDurationMs / pdfTotalPages));
    await renderPdfPage(pdfCurrentPage);
  } catch (e) {
    console.error('PDF load error:', e);
    safeAdvance();
  }
}

async function renderPdfPage(pageNum) {
  if (!pdfDoc || pdfCanvas.style.display === 'none') return;
  try {
    const page = await pdfDoc.getPage(pageNum);
    // Scale to fill the screen at device pixel ratio
    const dpr = window.devicePixelRatio || 1;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const viewport = page.getViewport({ scale: 1 });
    const scale = Math.min(vw / viewport.width, vh / viewport.height) * dpr;
    const scaledViewport = page.getViewport({ scale });

    pdfCanvas.width  = scaledViewport.width;
    pdfCanvas.height = scaledViewport.height;
    pdfCanvas.style.width  = (scaledViewport.width  / dpr) + 'px';
    pdfCanvas.style.height = (scaledViewport.height / dpr) + 'px';

    await page.render({
      canvasContext: pdfCanvas.getContext('2d'),
      viewport: scaledViewport
    }).promise;

    // Update page badge
    pdfPageBadge.textContent = `Page ${pageNum} / ${pdfTotalPages}`;

    // Schedule next page if there are more; otherwise let the outer timer handle advance
    if (pageNum < pdfTotalPages) {
      pdfPageStart = Date.now();
      pdfPageRemainingMs = null; // reset snapshot — fresh tick
      pdfPageTimer = setTimeout(async () => {
        pdfCurrentPage++;
        await renderPdfPage(pdfCurrentPage);
      }, pdfMsPerPage);
    }
    // When we reach the last page we simply stay on it until safeAdvance() fires
  } catch (e) {
    console.error('PDF render error:', e);
  }
}

function prevItem() {
  currentIdx = (currentIdx - 1 + items.length) % items.length;
  showItem(currentIdx);
}

function nextItem() {
  currentIdx = (currentIdx + 1) % items.length;
  showItem(currentIdx);
}

function clearTimers() {
  if (timer) clearTimeout(timer);
  if (progressInterval) clearInterval(progressInterval);
  if (pdfPageTimer) { clearTimeout(pdfPageTimer); pdfPageTimer = null; }
  // Silence video immediately — hideAll() runs 500ms later inside fadeOut,
  // so without this the previous video's audio plays through the black overlay.
  videoEl.pause();
  videoEl.muted = true;
  progressBar.style.width = '0%';
}

function startProgress(duration) {
  // FIX #7: always track remainingMs from full duration on a fresh item
  remainingMs = duration;
  progressStart = Date.now();
  progressInterval = setInterval(() => {
    if (paused) return;
    const elapsed = Date.now() - progressStart;
    const consumed = duration - remainingMs + elapsed;
    const pct = Math.min((consumed / duration) * 100, 100);
    progressBar.style.width = pct + '%';
  }, 100);
}

function togglePause() {
  paused = !paused;
  pauseBtn.textContent = paused ? '▶' : '⏸';
  if (paused) {
    clearTimeout(timer);
    videoEl.pause();
    // FIX #7: snapshot how much time is left at the moment of pause
    remainingMs = Math.max(0, remainingMs - (Date.now() - progressStart));
    // Pause PDF page advancement and snapshot remaining page time
    if (pdfPageTimer) {
      clearTimeout(pdfPageTimer);
      pdfPageTimer = null;
      // Store how much time was left on the current page tick
      pdfPageRemainingMs = Math.max(0, pdfMsPerPage - (Date.now() - pdfPageStart));
    }
  } else {
    // FIX #7: resume from the correct remaining time
    progressStart = Date.now();
    videoEl.play().catch(() => {});
    timer = setTimeout(() => safeAdvance(), remainingMs);
    // Resume PDF page advancement from where it was paused
    if (pdfDoc && pdfCurrentPage < pdfTotalPages) {
      pdfPageStart = Date.now();
      pdfPageTimer = setTimeout(async () => {
        pdfCurrentPage++;
        await renderPdfPage(pdfCurrentPage);
      }, pdfPageRemainingMs != null ? pdfPageRemainingMs : pdfMsPerPage);
    }
  }
}

function fadeOut(cb) {
  fadeOverlay.classList.add('fade-in');
  setTimeout(cb, 500);
}

function fadeIn() {
  setTimeout(() => fadeOverlay.classList.remove('fade-in'), 100);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextItem();
  if (e.key === 'ArrowLeft') prevItem();
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

// FIX #30: poll often so content edits reach the screen in seconds rather
// than minutes. Safe to do frequently now that loadPlaylist() only restarts
// playback when the content has actually changed.
setInterval(loadPlaylist, 15 * 1000);

loadPlaylist();
</script>
</body>
</html>
